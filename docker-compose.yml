services:
  frutas-api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/frutas.db
    volumes:
      - frutas-data:/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - frutas-api
    ports:
      - "4200:80"

  sonarqube:
    image: sonarqube:lts-community
    depends_on:
      - sonarqube-postgres
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  sonarqube-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: ${SONAR_JDBC_USERNAME:-sonar}
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
    volumes:
      - sonarqube-postgres:/var/lib/postgresql/data

volumes:
  frutas-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-postgres:
